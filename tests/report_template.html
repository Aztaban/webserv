<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webserv test report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            margin-bottom: 24px;
            color: #666;
        }

        .summary-card {
            display: flex;
            gap: 24px;
            padding: 16px;
            margin-bottom: 24px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid #ddd;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        tr.pass td:first-child {
            color: green;
            font-weight: bold;
        }

        tr.fail td:first-child {
            color: red;
            font-weight: bold;
        }

        tr:hover {
            background: #f0f0f0;
        }

        .footer {
            margin-top: 24px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>webserv test report</h1>
    <div class="subtitle">Generated by tests/runner.py</div>

    <!-- TEST_SUMMARY -->

    <table>
        <thead>
            <tr>
                <th>Status</th>
                <th>Group</th>
                <th>Test</th>
                <th>Duration</th>
                <th>Message</th>
            </tr>
        </thead>
        <tbody>
            <!-- TEST_ROWS -->
        </tbody>
    </table>

    <div class="footer">
        This report is generated automatically. Do not edit report.html manually.
    </div>
</body>
</html>
