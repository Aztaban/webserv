server {
    listen 127.0.0.1:8000;

    root ./tests/fixtures/www;
    index index.html;
    client_max_body_size 1000000;

    error_page 404 ./tests/fixtures/www/errors/404.html;

    location / {
        methods GET;
        root ./tests/fixtures/www;
        index index.html;
        autoindex off;
    }

    location /upload {
        methods GET POST;
        root ./tests/fixtures/www;
        upload on;
        upload_path ./tests/fixtures/www/uploads;
    }

    location /uploads {
        methods GET DELETE;
        root ./tests/fixtures/www/uploads;
        autoindex on;
    }
}

server {
    listen 127.0.0.1:8001;

    root ./tests/fixtures/www_second;
    index index.html;
    client_max_body_size 1000000;

    location / {
        methods GET;
        root ./tests/fixtures/www_second;
        index index.html;
        autoindex off;
    }
}