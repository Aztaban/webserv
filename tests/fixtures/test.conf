server {
    listen 127.0.0.1:8000;
    server_name primary.test localhost;

    root ./tests/fixtures/www;
    index index.html;
    client_max_body_size 1000000;

    error_page 404 ./tests/fixtures/www/errors/404.html;

    location / {
        methods GET;
        root ./tests/fixtures/www;
        index index.html;
        autoindex off;
    }

    location /upload {
        methods GET POST;
        root ./tests/fixtures/www;
        upload on;
        upload_path ./tests/fixtures/www/uploads;
    }

    location /uploads {
        methods GET DELETE;
        root ./tests/fixtures/www/uploads;
        autoindex on;
    }

    location /route {
        methods GET;
        root ./tests/fixtures/route_shallow;
    }

    location /route/deep {
        methods GET;
        root ./tests/fixtures/route_deep;
    }
}

server {
    listen 127.0.0.1:8000;
    server_name alternate.test alternate-alias.test;

    root ./tests/fixtures/www_virtual;
    index index.html;
    client_max_body_size 32;

    error_page 404 ./tests/fixtures/www_virtual/errors/404.html;

    location / {
        methods GET POST;
        root ./tests/fixtures/www_virtual;
        index index.html;
        autoindex off;
    }

    location /upload {
        methods POST;
        root ./tests/fixtures/www_virtual;
        upload on;
        upload_path ./tests/fixtures/www_virtual/uploads;
    }
}

server {
    listen 127.0.0.1:8001;
    server_name second-port.test;

    root ./tests/fixtures/www_second;
    index index.html;
    client_max_body_size 1000000;

    location / {
        methods GET;
        root ./tests/fixtures/www_second;
        index index.html;
        autoindex off;
    }
}
