server {
    listen 127.0.0.1:18080;
    server_name primary.test;

    root ./tests/fixtures/www;
    index index.html;
    client_max_body_size 65536;

    error_page 404 ./tests/fixtures/www/errors/404.html;

    location / {
        methods GET;
        root ./tests/fixtures/www;
        index index.html;
        autoindex off;
    }

    location /route {
        methods GET;
        root ./tests/fixtures/route_shallow;
        index index.html;
        autoindex off;
    }

    location /route/deep {
        methods GET;
        root ./tests/fixtures/route_deep;
        index index.html;
        autoindex off;
    }

    location /upload {
        methods GET POST;
        root ./tests/fixtures/www;
        upload on;
        upload_path ./tests/fixtures/www/uploads;
    }

    location /uploads {
        methods GET DELETE;
        root ./tests/fixtures/www/uploads;
        autoindex on;
    }

    location /old {
        methods GET;
        return 301 /;
    }

    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi_extension .py /usr/bin/python3;
    }
}

server {
    listen 127.0.0.1:18080;
    server_name alternate.test;

    root ./tests/fixtures/www_virtual;
    index index.html;
    client_max_body_size 32;

    error_page 404 ./tests/fixtures/www_virtual/errors/404.html;

    location / {
        methods GET;
        root ./tests/fixtures/www_virtual;
        index index.html;
        autoindex off;
    }

    location /upload {
        methods GET POST;
        root ./tests/fixtures/www;
        upload on;
        upload_path ./tests/fixtures/www/uploads;
    }

    location /old {
        methods GET;
        return 302 /;
    }
}

server {
    listen 127.0.0.1:18081;

    root ./tests/fixtures/www_second;
    index index.html;
    client_max_body_size 1000000;

    location / {
        methods GET;
        root ./tests/fixtures/www_second;
        index index.html;
        autoindex off;
    }
}