<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Static Banana Test</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="grid-bg"></div>
  <main class="wrap">
    <section class="page-hero">
      <div>
        <span class="eyebrow"><span class="dot"></span> static GET success</span>
        <h1>The server found<br><span class="gradient">the banana.</span></h1>
        <p class="lead">If this page is styled and all three orbiting photos load, Webserv served HTML, CSS and PNG files correctly.</p>
        <div class="page-actions"><a class="btn primary" href="/">Back home</a><a class="btn" href="/listing/">Open autoindex</a><a class="btn" href="/listing/crew.html">Next static file</a></div>
      </div>
      <div class="page-orbit">
        <div class="orbit-ring-two"></div>
        <div class="core-circle"><div class="big-emoji">🍌</div><span class="core-code">STATIC 200</span></div>
        <div class="satellite" style="--delay:0s"><div class="sat-photo"><img src="/assets/crew-1.png" alt="Crew member 1"></div></div>
        <div class="satellite" style="--delay:-5s"><div class="sat-photo"><img src="/assets/crew-2.png" alt="Crew member 2"></div></div>
        <div class="satellite" style="--delay:-10s"><div class="sat-photo"><img src="/assets/crew-3.png" alt="Crew member 3"></div></div>
      </div>
    </section>
  </main>

</html>
