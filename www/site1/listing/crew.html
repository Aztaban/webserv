<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Static Crew PNG Test</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="grid-bg"></div>
  <main class="wrap">
    <section class="page-hero">
      <div>
        <span class="eyebrow"><span class="dot"></span> static assets success</span>
        <h1>Three PNGs.<br><span class="gradient">One happy server.</span></h1>
        <p class="lead">The three circular portraits are separate local PNG requests. If they orbit correctly, the browser also received the shared CSS file.</p>
        <div class="page-actions"><a class="btn primary" href="/">Back home</a><a class="btn" href="/listing/banana.html">Open banana</a><a class="btn" href="/cgi-bin/hello.py?name=crew">Switch to CGI</a></div>
      </div>
      <div class="page-orbit">
        <div class="orbit-ring-two"></div>
        <div class="core-circle"><span class="core-small">STATIC</span><strong>PNG CREW</strong><span class="core-code">200 OK</span></div>
        <div class="satellite" style="--delay:0s"><div class="sat-photo"><img src="/assets/crew-1.png" alt="Crew member 1"></div></div>
        <div class="satellite" style="--delay:-5s"><div class="sat-photo"><img src="/assets/crew-2.png" alt="Crew member 2"></div></div>
        <div class="satellite" style="--delay:-10s"><div class="sat-photo"><img src="/assets/crew-3.png" alt="Crew member 3"></div></div>
      </div>
    </section>
  </main>
</body>
</html>
