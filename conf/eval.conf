server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root ./www;
    index index.html;
    client_max_body_size 200000000;

    error_page 400 ./www/site1/errors/400.html;
    error_page 403 ./www/site1/errors/403.html;
    error_page 404 ./www/site1/errors/404.html;
    error_page 405 ./www/site1/errors/405.html;
    error_page 413 ./www/site1/errors/413.html;
    error_page 500 ./www/site1/errors/500.html;

    location / {
        methods GET;
        root ./www/site1;
        index index.html;
        autoindex off;
    }


    location /post_body {
        methods POST;
        accept_body on;
        client_max_body_size 100;
        root ./www/site1;
    }

    location /directory {
        methods GET POST;
        root ./YoupiBanane;
        index youpi.bad_extension;
        autoindex off;
        cgi_extension .bla /home/diana/Documents/CORE/webserv/cgi_tester;
    }
}
