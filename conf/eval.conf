server { 
    listen 127.0.0.1:8080; 
    server_name localhost; 
 
    root ./YoupiBanane; 
    index youpi.bad_extension; 
 
    client_max_body_size 100000000; 
 
    location / { 
        methods GET; 
        root ./YoupiBanane; 
        index youpi.bad_extension; 
        autoindex off; 
    } 
 
    location /directory { 
        methods GET POST; 
        root ./YoupiBanane; 
        index youpi.bad_extension; 
        autoindex off; 
 
        cgi_extension .bla ../cgi_tester; 
    } 
 
    location /post_body { 
        methods POST; 
        root ./YoupiBanane; 
 
        upload on; 
        upload_path ./YoupiBanane; 
 
        client_max_body_size 100; 
    } 
}