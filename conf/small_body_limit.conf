server {
    listen 127.0.0.1:8000;
    server_name small_body_limit;

    root ./www/site1;
    index index.html;
    client_max_body_size 10;

    error_page 413 ./www/site1/errors/413.html;

    location /upload {
        methods POST;
        root ./www/site1;
        upload on;
        upload_path ./www/site1/uploads;
    }
}