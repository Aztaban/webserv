server {
    listen 127.0.0.1:8000;
    server_name cgi_test;

    root ./www/site1;
    index index.html;
    client_max_body_size 1000000;

    error_page 404 ./www/site1/errors/404.html;
    error_page 500 ./www/site1/errors/500.html;
    error_page 502 ./www/site1/errors/502.html;

    location / {
        methods GET;
        root ./www/site1;
        index index.html;
        autoindex off;
    }

    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi_extension .py /usr/bin/pyhon3;
    }
}
