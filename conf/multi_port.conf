server {
    listen 127.0.0.1:8000;
    server_name site1;

    root ./www/site1;
    index index.html;
    client_max_body_size 1000000;

    error_page 404 ./www/site1/errors/404.html;

    location / {
        methods GET;
        root ./www/site1;
        index index.html;
        autoindex off;
    }
}

