server {
    listen 127.0.0.1:8000;
    server_name site1;

    root ./www/site1;
    index index.html;
    client_max_body_size 1000000;

    error_page 400 ./www/site1/errors/400.html;
    error_page 403 ./www/site1/errors/403.html;
    error_page 404 ./www/site1/errors/404.html;
    error_page 405 ./www/site1/errors/405.html;
    error_page 413 ./www/site1/errors/413.html;
    error_page 500 ./www/site1/errors/500.html;

    location /autoindex {
        methods GET;
        root ./www;
        autoindex on;
    }

    location / {
        methods GET;
        root ./www/site1;
        index index.html;
        autoindex off;
    }

    location /static {
        methods GET;
        root ./www/site1;
        index index.html;
        autoindex off;
    }

    location /listing {
        methods GET;
        root ./www/site1/listing;
        autoindex on;
    }

    location /upload {
        methods GET POST;
        root ./www/site1;
        upload on;
        upload_path ./www/site1/uploads;
        autoindex off;
    }

    location /uploads {
        methods GET DELETE;
        root ./www/site1/uploads;
        autoindex on;
    }

    location /old {
        methods GET;
        return 301 /;
    }

    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi_extension .py /usr/bin/python3;
    }
}
