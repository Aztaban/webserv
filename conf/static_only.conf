server {
    listen 127.0.0.1:8000;
    server_name static_only;

    root ./www/site1;
    index index.html;
    client_max_body_size 1000000;

    error_page 404 ./www/site1/errors/404.html;
    error_page 405 ./www/site1/errors/405.html;

    location / {
        methods GET;
        root ./www/site1;
        index index.html;
        autoindex off;
    }

    location /listing {
        methods GET;
        root ./www/site1/listing;
        autoindex on;
    }
}
